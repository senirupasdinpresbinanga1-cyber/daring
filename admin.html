<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pembelajaran Daring</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: #111; border-bottom: 1px solid #333; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .container { padding: 30px; flex: 1; }
        .box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #333; padding: 10px 14px; text-align: left; font-size: 13px; }
        th { background: #1a1a1a; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        tr:hover { background: #181818; }

        .btn { background: #fff; color: #000; border: none; padding: 8px 16px; font-weight: 700; font-size: 12px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #fff; }
        .btn-danger { background: #000; color: #fff; border: 1px solid #fff; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #111; border: 1px solid #333; padding: 15px; text-align: center; border-radius: 6px; }
        .stat-card h3 { font-size: 28px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Panel Admin Pembelajaran Daring</h1>
        <button class="btn btn-outline" onclick="logout()">Keluar</button>
    </div>

    <div class="container">
        <div class="stat-grid">
            <div class="stat-card">
                <p style="font-size: 11px; color: #aaa;">TOTAL SISWA</p>
                <h3 id="totSiswa">0</h3>
            </div>
            <div class="stat-card">
                <p style="font-size: 11px; color: #aaa;">SUDAH SELESAI</p>
                <h3 id="totSelesai">0</h3>
            </div>
            <div class="stat-card">
                <p style="font-size: 11px; color: #aaa;">RATA-RATA NILAI</p>
                <h3 id="avgNilai">0</h3>
            </div>
        </div>

        <div class="box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Rekapitulasi Nilai Siswa</h3>
                <button class="btn btn-outline" onclick="loadData()">Refresh Data</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>NISN</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Status</th>
                        <th>Nilai</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwk8sODgZTX0rxUMnAyMHdwwxP1tKMQ8rf8kCyjYB2omuimdtJ6BLSZ-2xnn6CTR7k0/exec';

        if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('role') !== 'admin') window.location.href = 'index.html';

        window.addEventListener('DOMContentLoaded', loadData);

        function loadData() {
            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'getAdminData' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('totSiswa').innerText = data.siswa.length;

                    let selesaiCount = 0;
                    let totNilai = 0;
                    let html = '';

                    data.log.forEach(l => {
                        if (l.status.includes('Selesai')) {
                            selesaiCount++;
                            totNilai += parseFloat(l.nilai_akhir || 0);
                        }

                        html += `<tr>
                            <td>${new Date(l.waktu).toLocaleString('id-ID')}</td>
                            <td>${l.nisn}</td>
                            <td>${l.nama}</td>
                            <td>${l.kelas}</td>
                            <td>${l.status}</td>
                            <td><b>${l.nilai_akhir || 0}</b></td>
                            <td><button class="btn btn-danger" onclick="resetSiswa('${l.nisn}')">Reset</button></td>
                        </tr>`;
                    });

                    document.getElementById('totSelesai').innerText = selesaiCount;
                    document.getElementById('avgNilai').innerText = selesaiCount > 0 ? (totNilai / selesaiCount).toFixed(2) : 0;
                    document.getElementById('logTableBody').innerHTML = html || '<tr><td colspan="7" style="text-align:center;">Belum ada data.</td></tr>';
                }
            });
        }

        function resetSiswa(nisn) {
            if (!confirm('Reset pengerjaan siswa ini?')) return;
            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'resetSiswa', nisn: nisn })
            })
            .then(res => res.json())
            .then(() => loadData());
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
