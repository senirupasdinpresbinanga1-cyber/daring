<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pembelajaran Daring</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: #111; border-bottom: 1px solid #333; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .container { padding: 30px; flex: 1; }
        .box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #333; padding: 10px 14px; text-align: left; font-size: 13px; }
        th { background: #1a1a1a; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        tr:hover { background: #181818; }

        .btn { background: #fff; color: #000; border: none; padding: 8px 16px; font-weight: 700; font-size: 12px; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { background: #ccc; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #fff; }
        .btn-outline.active { background: #fff; color: #000; }
        .btn-danger { background: #000; color: #fff; border: 1px solid #fff; padding: 6px 12px; font-size: 11px; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #111; border: 1px solid #333; padding: 15px; text-align: center; border-radius: 6px; }
        .stat-card h3 { font-size: 28px; margin-top: 5px; }
        
        .class-filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Panel Admin Pembelajaran Daring</h1>
        <button class="btn btn-outline" onclick="logout()">Keluar</button>
    </div>

    <div class="container">
        <div class="stat-grid">
            <div class="stat-card">
                <p style="font-size: 11px; color: #aaa;">TOTAL SISWA</p>
                <h3 id="totSiswa">0</h3>
            </div>
            <div class="stat-card">
                <p style="font-size: 11px; color: #aaa;">SUDAH SELESAI</p>
                <h3 id="totSelesai">0</h3>
            </div>
            <div class="stat-card">
                <p style="font-size: 11px; color: #aaa;">RATA-RATA NILAI</p>
                <h3 id="avgNilai">0</h3>
            </div>
        </div>

        <div class="box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3>Rekapitulasi Nilai Siswa</h3>
                <button class="btn btn-outline" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>

            <!-- TOMBOL PILIHAN KELAS 6A & 6B -->
            <div class="class-filter-bar">
                <button class="btn btn-outline active" id="btnKelas6A" onclick="filterKelas('6A')">Kelas 6A</button>
                <button class="btn btn-outline" id="btnKelas6B" onclick="filterKelas('6B')">Kelas 6B</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NISN / Absen</th>
                        <th>Nama Siswa</th>
                        <th>Kelas</th>
                        <th>Status Pengerjaan</th>
                        <th>Nilai</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwk8sODgZTX0rxUMnAyMHdwwxP1tKMQ8rf8kCyjYB2omuimdtJ6BLSZ-2xnn6CTR7k0/exec';

        if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('role') !== 'admin') window.location.href = 'index.html';

        let globalSiswa = [];
        let globalLog = [];
        let selectedKelas = '6A';

        window.addEventListener('DOMContentLoaded', loadData);

        function loadData() {
            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'getAdminData' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    globalSiswa = data.siswa || [];
                    globalLog = data.log || [];

                    document.getElementById('totSiswa').innerText = globalSiswa.length;

                    let selesaiCount = 0;
                    let totNilai = 0;

                    globalLog.forEach(l => {
                        if (l.status && l.status.includes('Selesai')) {
                            selesaiCount++;
                            totNilai += parseFloat(l.nilai_akhir || 0);
                        }
                    });

                    document.getElementById('totSelesai').innerText = selesaiCount;
                    document.getElementById('avgNilai').innerText = selesaiCount > 0 ? (totNilai / selesaiCount).toFixed(2) : 0;

                    renderTable();
                }
            });
        }

        function filterKelas(kelasStr) {
            selectedKelas = kelasStr;
            document.getElementById('btnKelas6A').classList.toggle('active', kelasStr === '6A');
            document.getElementById('btnKelas6B').classList.toggle('active', kelasStr === '6B');
            renderTable();
        }

        function renderTable() {
            // Filter ketat berdasarkan teks kelas di sheet Siswa (mengandung '6a' atau '6b')
            const filteredSiswa = globalSiswa.filter(s => {
                const k = (s.kelas || "").toLowerCase().trim();
                if (selectedKelas === '6A') return k.includes('6a') || k.includes('kelas a');
                if (selectedKelas === '6B') return k.includes('6b') || k.includes('kelas b');
                return true;
            });

            let logMap = {};
            globalLog.forEach(l => {
                logMap[l.nisn.toString().trim()] = l;
            });

            let html = '';
            filteredSiswa.forEach((s, idx) => {
                const logItem = logMap[s.nisn.toString().trim()];
                let statusBadge = '<span style="color:#888;">Belum Mulai</span>';
                let nilaiVal = '-';
                let actionBtn = '-';

                if (logItem) {
                    statusBadge = logItem.status;
                    nilaiVal = `<b>${logItem.nilai_akhir || 0}</b>`;
                    actionBtn = `<button class="btn btn-danger" onclick="resetSiswa('${s.nisn}')">Reset</button>`;
                }

                html += `<tr>
                    <td>${idx + 1}</td>
                    <td>${s.nisn}</td>
                    <td>${s.nama}</td>
                    <td>${s.kelas}</td>
                    <td>${statusBadge}</td>
                    <td>${nilaiVal}</td>
                    <td>${actionBtn}</td>
                </tr>`;
            });

            document.getElementById('logTableBody').innerHTML = html || '<tr><td colspan="7" style="text-align:center;">Tidak ada data siswa pada kelas ini.</td></tr>';
        }

        function resetSiswa(nisn) {
            if (!confirm('Reset pengerjaan siswa dengan NISN ' + nisn + '?')) return;
            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'resetSiswa', nisn: nisn })
            })
            .then(res => res.json())
            .then(() => loadData());
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
